<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Digital | OFC</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a"/>
    <link rel="apple-touch-icon" href="src/orquestra.png">
    <link rel="shortcut icon" href="src/orquestra.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="dark-mode">

    <div class="app-container">
        <main id="main-view">
            <header class="app-header">
                <div class="header-top">
                    <div class="brand-container">
                        <img src="src/orquestra.png" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
                        <h1 class="orchestra-title">Biblioteca Digital</h1>
                    </div>
                    <button class="theme-switcher" id="theme-switcher-btn"><i class="fas fa-sun"></i></button>
                </div>
                <div class="search-container">
                    <i class="fas fa-search search-icon"></i>
                    <input type="search" id="search-input" class="search-bar" placeholder="Buscar peça, arranjador ou instrumento...">
                </div>
            </header>

            <div id="music-list">
                <div id="initial-message" class="initial-message">
                    <p>Carregando músicas...</p>
                 </div>
            </div>
        </main>

        <section id="details-view" class="hidden">
            <div class="details-header">
                <button class="back-btn" id="back-to-list-btn"><i class="fas fa-arrow-left"></i></button>
                <div class="details-title-container">
                    <h2 id="details-title">Nome da Música</h2>
                    <h5 id="details-arranger">Arranjador</h5>
                </div>
            </div>
            <div class="instrument-selector">
                <select id="instrument-select">
                </select>
            </div>
            <div class="pdf-viewer-container">
                 <iframe id="pdf-viewer" title="Visualizador de Partitura" style="width: 100%; height: 70vh; border: none; border-radius: 12px; background-color: var(--surface-color);"></iframe>
            </div>
            <div id="no-pdf-message" class="no-pdf hidden">
                <p style="text-align: center; padding: 2rem; color: var(--text-muted);">Nenhuma partitura encontrada para a seleção.</p>
            </div>
            <div class="details-actions" style="margin-top: 1rem;">
                 <a id="download-pdf-btn" class="action-button download-btn" href="#" download target="_blank" style="display: none;">
                    <i class="fas fa-download"></i> Baixar PDF
                 </a>
            </div>
        </section>

    </div>

    <button class="fab" id="add-music-fab" title="Adicionar Nova Música"><i class="fas fa-plus"></i></button>

    <div id="music-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Adicionar Nova Música</h3>
                <button class="close-modal-btn" id="close-modal-btn">&times;</button>
            </div>
            <form id="music-form" novalidate>
                <input type="hidden" id="music-id">
                <div class="form-group">
                    <label for="music-title">Nome da Música</label>
                    <input type="text" id="music-title" required>
                </div>
                <div class="form-group">
                    <label for="music-arranger">Arranjador</label>
                    <input type="text" id="music-arranger" required>
                </div>
                <div class="form-group">
                    <label for="music-audio">Áudio da Música (Opcional)</label>
                    <input type="file" id="music-audio" accept="audio/*">
                    <span id="current-audio-file" class="current-file-name" style="font-size: 0.85rem; color: var(--text-muted); display: block; margin-top: 0.5rem;"></span>
                </div>
                <div class="form-group">
                    <label for="music-pdfs">Partituras (PDFs)</label>
                    <input type="file" id="music-pdfs" accept=".pdf" multiple>
                    <small style="color: var(--text-muted); display: block; margin-top: 0.5rem;">Dica: Nomeie cada PDF como "Instrumento.pdf" (ex: "Violino I.pdf")</small>
                    <div id="current-pdfs-list" class="current-files-list" style="margin-top: 0.5rem; font-size: 0.85rem;"></div>
                </div>
                <div class="modal-actions" style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="button" class="action-button cancel-btn" id="cancel-btn" style="background: transparent; border: 1px solid var(--border); color: var(--text-main);">Cancelar</button>
                    <button type="submit" class="action-button" id="save-music-btn" style="background: var(--primary); color: white;">Salvar</button>
                </div>
                 <div id="loading-indicator" class="loading-indicator hidden" style="text-align: center; margin-top: 1rem; color: var(--primary);">Salvando...</div>
            </form>
        </div>
    </div>

    <div id="audio-player-container" class="audio-player-container hidden">
        <div id="now-playing">
            <i class="fas fa-music"></i>
            <span id="now-playing-title"></span>
        </div>
        <audio id="audio-player" controls></audio>
        <button id="close-player-btn" class="close-player-btn" title="Fechar Player" style="background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer;">&times;</button>
    </div>

    <script src="main.js" type="module"></script>
</body>
</html>
